fragment Link on LinkData {
  url
  label
  defaultLabel
  target
}

query ($siteId: [QueryArgument]) {
  footer: globalSet(handle: "footer", siteId: $siteId) {
    ... on footer_GlobalSet {
      navigation {
        ... on navItem_Entry {
          navLink {
            ...Link
          }
        }
      }
    }
  }
  currentQuarter: entry(
    section: "quarters"
    orderBy: "postDate desc"
    siteId: $siteId
  ) {
    ... on quarter_Entry {
      id
      title
    }
  }
}
